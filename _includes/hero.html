{%- assign t = site.data.i18n[include.lang] -%}
<section class="hero wrap">
  <h1>{{ site.author.name }}</h1>
  <p class="lede">{{ include.lede }}</p>
  <figure class="hero-figure">
    {% include hero-mesh.svg %}

  </figure>
</section>
