# Research lines. `id` links publications (topics) to each line.
# `figure` is an SVG in _includes/; replace with an image path in `image:` to use a real simulation figure.

- id: poro
  gallery:
    - src: /assets/img/papers/bpnp-polarization.jpg
      width: 1400
      height: 922
      en: "Ionic polarization in a charged porous medium (Example 3): electric potential, displacement magnitude and Darcy flux for applied voltages V = 0 (top) and V = 0.9 (bottom), computed with FEniCS. From C. Inzunza, <em>A pseudostress-based fully mixed finite element method for the stationary Biot–Poisson–Nernst–Planck system</em>, submitted."
      es: "Polarización iónica en un medio poroso cargado (Ejemplo 3): potencial eléctrico, magnitud del desplazamiento y flujo de Darcy para voltajes aplicados V = 0 (arriba) y V = 0.9 (abajo), calculados con FEniCS. De C. Inzunza, <em>A pseudostress-based fully mixed finite element method for the stationary Biot–Poisson–Nernst–Planck system</em>, enviado."
  figure: thumb-poro.svg
  en:
    title: "Poroelasticity and multiphysics coupling"
    short: "Biot's consolidation model coupled with heat transfer, electrochemical transport and fluid inertia."
    text: >-
      I study Biot's poroelasticity model and its couplings with heat transfer,
      Poisson–Nernst–Planck electrochemical transport, and Brinkman and Forchheimer
      flow. The formulations use the total pressure and pseudostress-type unknowns,
      and are designed to remain stable in the nearly incompressible limit, where
      standard discretisations suffer from locking. Applications include deformable
      porous media in engineering and fluid flow in biological tissues.
    caption: "Manufactured solution of Example 1 in Careaga, Gatica, Inzunza and Ruiz-Baier (IMA J. Numer. Anal., 2025): fluid pressure on the deformed configuration, with the undeformed domain dashed."
  es:
    title: "Poroelasticidad y acoplamientos multifísicos"
    short: "El modelo de consolidación de Biot acoplado con transferencia de calor, transporte electroquímico e inercia del fluido."
    text: >-
      Estudio el modelo de poroelasticidad de Biot y sus acoplamientos con
      transferencia de calor, transporte electroquímico de Poisson–Nernst–Planck
      y flujo de Brinkman y Forchheimer. Las formulaciones utilizan la presión total
      e incógnitas de tipo pseudotensión, y están diseñadas para mantenerse estables
      en el límite casi incompresible, donde las discretizaciones estándar sufren
      bloqueo (locking). Las aplicaciones incluyen medios porosos deformables en
      ingeniería y el flujo de fluidos en tejidos biológicos.
    caption: "Solución manufacturada del Ejemplo 1 de Careaga, Gatica, Inzunza y Ruiz-Baier (IMA J. Numer. Anal., 2025): presión del fluido sobre la configuración deformada, con el dominio sin deformar en línea discontinua."

- id: flow
  figure: thumb-flow.svg
  en:
    title: "Flow in porous media and incompressible fluids"
    short: "Mixed methods for Stokes, Navier–Stokes, Brinkman and Brinkman–Forchheimer flows."
    text: >-
      Mixed finite element methods for Stokes, Navier–Stokes, Brinkman and
      Brinkman–Forchheimer equations, including convective terms, variable porosity
      and nearly incompressible elasticity. The analysis relies on Banach-space
      formulations in which the natural integrability of the nonlinear terms
      determines the functional setting.
    caption: "Velocity magnitude near the cavity in the channel of Example 4 in Caucao, Gatica, Gatica and Inzunza (J. Comput. Appl. Math., 2027), on the finest adapted mesh, recomputed for this page. The flow accelerates above the cavity and bends away from the low-porosity region."
  es:
    title: "Flujo en medios porosos y fluidos incompresibles"
    short: "Métodos mixtos para flujos de Stokes, Navier–Stokes, Brinkman y Brinkman–Forchheimer."
    text: >-
      Métodos de elementos finitos mixtos para las ecuaciones de Stokes,
      Navier–Stokes, Brinkman y Brinkman–Forchheimer, incluyendo términos convectivos,
      porosidad variable y elasticidad casi incompresible. El análisis se apoya en
      formulaciones en espacios de Banach, donde la integrabilidad natural de los
      términos no lineales determina el marco funcional.
    caption: "Magnitud de la velocidad cerca de la cavidad en el canal del Ejemplo 4 de Caucao, Gatica, Gatica e Inzunza (J. Comput. Appl. Math., 2027), en la malla adaptada más fina, recalculada para esta página. El flujo se acelera sobre la cavidad y se desvía de la región de baja porosidad."

- id: transport
  gallery:
    - src: /assets/img/papers/sedimentation-kynch.jpg
      width: 1364
      height: 420
      en: "Batch settling in a heated vessel (batch Kynch test, Example 2): solids concentration at four times, with the cold wall on the left and the hot wall on the right. From J. Careaga and C. Inzunza, <em>Mixed finite element methods for a heat-assisted model of sedimentation</em>, arXiv:2610.28903."
      es: "Sedimentación en un recipiente calefaccionado (test de Kynch por lotes, Ejemplo 2): concentración de sólidos en cuatro instantes, con la pared fría a la izquierda y la caliente a la derecha. De J. Careaga y C. Inzunza, <em>Mixed finite element methods for a heat-assisted model of sedimentation</em>, arXiv:2610.28903."
    - src: /assets/img/papers/bpnp-adaptive-charge.jpg
      width: 1100
      height: 630
      en: "Adapted mesh after four refinements and mobile-charge difference at V = 0 (Example 3). The refinement concentrates at the transition of the fixed charge. From C. Inzunza, <em>A pseudostress-based fully mixed finite element method for the stationary Biot–Poisson–Nernst–Planck system</em>, submitted."
      es: "Malla adaptada tras cuatro refinamientos y diferencia de carga móvil para V = 0 (Ejemplo 3). El refinamiento se concentra en la transición de la carga fija. De C. Inzunza, <em>A pseudostress-based fully mixed finite element method for the stationary Biot–Poisson–Nernst–Planck system</em>, enviado."
  figure: thumb-transport.svg
  en:
    title: "Transport, diffusion and their coupling with mechanics"
    short: "Stress-assisted diffusion, chemotaxis–fluid interaction, Boussinesq flows and sedimentation."
    text: >-
      Coupled problems in which a concentration or temperature is transported by a
      flow or driven by mechanical stress: stress-assisted diffusion,
      chemotaxis–Navier–Stokes, Boussinesq-type models, flow–transport systems and
      heat-assisted sedimentation. Well-posedness is typically obtained through
      fixed-point arguments combined with the theory of mixed and monotone problems.
    caption: "Initial cell density of Example 3 in Caucao, Colmenares, Gatica and Inzunza (Comput. Math. Appl., 2023): three clusters near the top of the domain, with level lines of the chemical signal."
  es:
    title: "Transporte, difusión y su acoplamiento con la mecánica"
    short: "Difusión asistida por tensiones, interacción quimiotaxis–fluido, flujos de Boussinesq y sedimentación."
    text: >-
      Problemas acoplados en que una concentración o una temperatura es transportada
      por un flujo o impulsada por tensiones mecánicas: difusión asistida por
      tensiones, quimiotaxis–Navier–Stokes, modelos de tipo Boussinesq, sistemas de
      flujo–transporte y sedimentación asistida por calor. El buen planteamiento se
      obtiene usualmente mediante argumentos de punto fijo combinados con la teoría
      de problemas mixtos y monótonos.
    caption: "Densidad celular inicial del Ejemplo 3 de Caucao, Colmenares, Gatica e Inzunza (Comput. Math. Appl., 2023): tres cúmulos cerca del borde superior, con curvas de nivel de la señal química."

- id: apost
  gallery:
    - src: /assets/img/papers/bpnp-adaptive-star.jpg
      width: 1400
      height: 557
      en: "Adaptive refinement on a star-shaped domain (Example 2): final mesh, charge difference and electric-displacement magnitude, with RT1–P1 elements and 300,770 degrees of freedom. From C. Inzunza, <em>A pseudostress-based fully mixed finite element method for the stationary Biot–Poisson–Nernst–Planck system</em>, submitted."
      es: "Refinamiento adaptativo en un dominio estrellado (Ejemplo 2): malla final, diferencia de carga y magnitud del desplazamiento eléctrico, con elementos RT1–P1 y 300.770 grados de libertad. De C. Inzunza, <em>A pseudostress-based fully mixed finite element method for the stationary Biot–Poisson–Nernst–Planck system</em>, enviado."
  figure: thumb-adapt.svg
  en:
    title: "A posteriori error analysis and adaptivity"
    short: "Reliable and efficient residual estimators for mixed methods in Banach spaces."
    text: >-
      Residual-based a posteriori error estimators for fully-mixed and mixed-primal
      methods, with proofs of reliability and efficiency, and their use to drive
      adaptive mesh refinement in problems with singularities or sharp layers.
    caption: "Porosity of the same channel on the finest mesh of the adaptive sequence. The refinement follows the cavity corners and the two low-porosity regions."
  es:
    title: "Análisis de error a posteriori y adaptatividad"
    short: "Estimadores residuales confiables y eficientes para métodos mixtos en espacios de Banach."
    text: >-
      Estimadores de error a posteriori de tipo residual para métodos totalmente
      mixtos y primal-mixtos, con demostraciones de confiabilidad y eficiencia, y su
      uso para guiar el refinamiento adaptativo de mallas en problemas con
      singularidades o capas abruptas.
    caption: "Porosidad del mismo canal en la malla más fina de la secuencia adaptativa. El refinamiento sigue las esquinas de la cavidad y las dos regiones de baja porosidad."
